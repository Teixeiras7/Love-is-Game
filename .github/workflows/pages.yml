# Publica a versão web (Jogo/web) no GitHub Pages a cada push na main.
# Link: https://teixeiras7.github.io/Love-is-Game/
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Regenera Jogo/web/arte (imagens + falas) a partir de Jogo/arte e Falas.java,
      # assim o site nunca fica com falas antigas, mesmo sem rodar o exportar-web.bat.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gerar arte e falas da versão web
        working-directory: Jogo
        run: |
          mkdir -p bin
          javac -encoding UTF-8 -d bin -sourcepath src ferramentas/ExportarWeb.java
          java -Djava.awt.headless=true -cp bin view.ExportarWeb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Jogo/web
      - id: deployment
        uses: actions/deploy-pages@v4
